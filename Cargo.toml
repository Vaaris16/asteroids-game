[package]
name = "asteroids-game"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = {
  version = "0.7.0",
  default-features = false,
  features = [
    "2d",
    "parry-f32",
  ]
}
bevy = {version = "0.19.1", features=["wav"]}
rand = "0.10.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
